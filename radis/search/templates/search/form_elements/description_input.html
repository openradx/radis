{% load bootstrap_icon from common_extras %}
<div class="input-group"
     id="description_row"
     x-cloak
     x-show="mode === 'semantic'">
    <textarea name="description"
              id="id_description"
              class="form-control"
              rows="2"
              maxlength="1000"
              aria-label="Description of the reports you are looking for"
              placeholder="Describe the reports you are looking for"
              :disabled="mode !== 'semantic'"
              @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); $el.form.requestSubmit() }">{{ value }}</textarea>
    <button type="submit" class="btn btn-primary">{% bootstrap_icon "search" 20 %}</button>
</div>
