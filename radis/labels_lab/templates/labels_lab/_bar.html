<div class="d-flex align-items-center gap-2 small">
    <span class="text-muted lab-bar-label">{{ label }}</span>
    <div class="progress lab-bar"
         role="progressbar"
         aria-label="{{ label }}"
         aria-valuenow="{% widthratio p 1 100 %}"
         aria-valuemin="0"
         aria-valuemax="100">
        <div class="progress-bar" style="width: {% widthratio p 1 100 %}%"></div>
    </div>
    <span class="font-monospace">{{ p|floatformat:4 }}</span>
</div>
