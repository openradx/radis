x-app: &default-app
  build:
    target: development
  pull_policy: build
  # Makes a provider running on the Docker host reachable as host.docker.internal,
  # also on plain Linux Docker where it is not provided automatically.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    DJANGO_SETTINGS_MODULE: radis.settings.development
  develop:
    watch:
      - action: sync
        path: .
        target: /app
        ignore:
          - .git/
          - .venv/
          - node_modules/
      - action: rebuild
        path: ./pyproject.toml

services:
  init:
    <<: *default-app
    profiles:
      - never

  web:
    <<: *default-app
    image: radis_dev-web:latest
    ports:
      - ${WEB_DEV_PORT:-8000}:8000
      - ${REMOTE_DEBUGGING_PORT:-5678}:5678
    command: >
      bash -c "
        wait-for-it -s postgres.local:5432 -t ${WAIT_POSTGRES_TIMEOUT:-180} &&
        ./manage.py migrate &&
        ./manage.py create_superuser &&
        ./manage.py create_example_users &&
        ./manage.py create_example_groups &&
        ./manage.py populate_example_reports --lng ${EXAMPLE_REPORTS_LANGUAGE:-en} &&
        ./manage.py retry_stalled_jobs &&
        ./manage.py runserver 0.0.0.0:8000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]

  default_worker:
    <<: *default-app
    image: radis_dev-default_worker:latest
    command: >
      bash -c "
        wait-for-it -s postgres.local:5432 -t ${WAIT_POSTGRES_TIMEOUT:-180} &&
        wait-for-it -s web.local:8000 -t 300 &&
        ./manage.py sweep_stale_tasks &&
        ./manage.py bg_worker -l debug -q default --autoreload
      "

  llm_worker:
    <<: *default-app
    image: radis_dev-llm_worker:latest
    command: >
      bash -c "
        wait-for-it -s postgres.local:5432 -t ${WAIT_POSTGRES_TIMEOUT:-180} &&
        wait-for-it -s web.local:8000 -t 300 &&
        ./manage.py sweep_stale_tasks &&
        ./manage.py bg_worker -l debug -q llm --autoreload
      "

  embeddings_worker:
    <<: *default-app
    image: radis_dev-embeddings_worker:latest
    command: >
      bash -c "
        wait-for-it -s postgres.local:5432 -t ${WAIT_POSTGRES_TIMEOUT:-180} &&
        ./manage.py bg_worker -l debug -q embeddings --autoreload --concurrency ${EMBEDDINGS_WORKER_CONCURRENCY:-2}
      "

  postgres:
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - ${POSTGRES_DEV_PORT:-5432}:5432
