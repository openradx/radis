x-app: &default-app
  image: ${RADIS_IMAGE:-ghcr.io/openradx/radis:latest}
  volumes:
    - web_data:/var/www/web
    - ${SSL_SERVER_CERT_FILE:?}:/etc/web/ssl/cert.pem
    - ${SSL_SERVER_KEY_FILE:?}:/etc/web/ssl/key.pem
  environment:
    DJANGO_SETTINGS_MODULE: radis.settings.production
    DJANGO_STATIC_ROOT: /var/www/web/static/

x-deploy: &deploy
  replicas: 1
  restart_policy:
    condition: on-failure
    max_attempts: 3

services:
  # We can't use those manage commands inside the web container in production because
  # the web service may have multiple replicas. So we make sure to only run them once
  # and wait for it to be finished by the web service containers.
  #
  # init opens its ok_server port only after `migrate` finishes, and every
  # service below waits for that port, so WAIT_INIT_TIMEOUT must stay above the
  # longest migration a deploy runs -- a data migration over a large archive can
  # take many minutes, and a timeout aborts the `&&` chain and exits the
  # container.
  init:
    <<: *default-app
    hostname: init.local
    command: >
      bash -c "
        wait-for-it -s postgres.local:5432 -t ${WAIT_POSTGRES_TIMEOUT:-180} &&
        ./manage.py migrate &&
        ./manage.py createcachetable &&
        ./manage.py collectstatic --no-input &&
        ./manage.py create_superuser &&
        ./manage.py retry_stalled_jobs &&
        ./manage.py ok_server --host 0.0.0.0 --port 8000
      "
    deploy:
      <<: *deploy

  web:
    <<: *default-app
    build:
      target: production
    ports:
      - ${WEB_HTTP_PORT:-80}:80
      - ${WEB_HTTPS_PORT:-443}:443
    command: >
      bash -c "
        wait-for-it -s init.local:8000 -t ${WAIT_INIT_TIMEOUT:-3600} &&
        echo 'Starting web server ...' &&
        daphne -b 0.0.0.0 -p 80 \\
          -e ssl:443:privateKey=/etc/web/ssl/key.pem:certKey=/etc/web/ssl/cert.pem \\
          radis.asgi:application
      "
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost/health/"]
    deploy:
      <<: *deploy
      replicas: 3

  default_worker:
    <<: *default-app
    command: >
      bash -c "
        wait-for-it -s postgres.local:5432 -t ${WAIT_POSTGRES_TIMEOUT:-180} &&
        wait-for-it -s init.local:8000 -t ${WAIT_INIT_TIMEOUT:-3600} &&
        ./manage.py sweep_stale_tasks &&
        ./manage.py bg_worker -q default
      "
    deploy:
      <<: *deploy

  llm_worker:
    <<: *default-app
    command: >
      bash -c "
        wait-for-it -s postgres.local:5432 -t ${WAIT_POSTGRES_TIMEOUT:-180} &&
        wait-for-it -s init.local:8000 -t ${WAIT_INIT_TIMEOUT:-3600} &&
        ./manage.py sweep_stale_tasks &&
        ./manage.py bg_worker -q llm
      "
    deploy:
      <<: *deploy

  embeddings_worker:
    <<: *default-app
    command: >
      bash -c "
        wait-for-it -s postgres.local:5432 -t ${WAIT_POSTGRES_TIMEOUT:-180} &&
        ./manage.py bg_worker -q embeddings --concurrency ${EMBEDDINGS_WORKER_CONCURRENCY:-2}
      "
    deploy:
      <<: *deploy

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    deploy:
      <<: *deploy

volumes:
  web_data:
