x-app: &default-app
  volumes:
    - ${BACKUP_DIR:?}:/backups
  depends_on:
    - postgres
  env_file:
    - .env
  environment:
    DATABASE_URL: postgres://postgres:postgres@postgres.local:5432/postgres
    DBBACKUP_STORAGE_LOCATION: /backups
    IS_DOCKER_CONTAINER: 1
    # STACK_NAME is computed by the CLI and passed as process environment variable,
    # it is not necessarily set in the .env file.
    STACK_NAME: ${STACK_NAME:-}

services:
  init:
    <<: *default-app
    hostname: init.local

  web:
    <<: *default-app
    build:
      args:
        - PROJECT_VERSION=${PROJECT_VERSION:?}
    hostname: web.local

  default_worker:
    <<: *default-app
    hostname: default_worker.local

  llm_worker:
    <<: *default-app
    hostname: llm_worker.local

  embeddings_worker:
    <<: *default-app
    hostname: embeddings_worker.local

  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    hostname: postgres.local
    command:
      - postgres
      - -c
      - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-4}
      - -c
      - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-8}
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-8}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # PostgreSQL's parallel workers exchange data through dynamic shared
      # memory in /dev/shm, and Docker's default segment is 64 MB. Parallel
      # maintenance (the HNSW rebuild in pgsearch migration 0006) pre-allocates
      # its whole budget there, so size this at least as large as
      # PGSEARCH_HNSW_REBUILD_MAINTENANCE_WORK_MEM. Bytes, because
      # `docker stack deploy` rejects unit suffixes here (default: 1 GiB).
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: ${POSTGRES_SHM_SIZE_BYTES:-1073741824}

volumes:
  postgres_data:
